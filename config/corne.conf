# ============================================================================
# DISPLAY CONFIGURATION - VERTICAL LAYOUT
# ============================================================================
# Enable the Corne OLED Display
CONFIG_ZMK_DISPLAY=y        
# Enable custom status screen (required for zmk-nice-oled widgets)
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Dedicated work queue for display (improves performance)
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Blank display on idle to prevent OLED burn-in
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# LVGL configuration for vertical OLED (68x160 pixels)
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_DPI_DEF=161
CONFIG_LV_Z_BITS_PER_PIXEL=1
CONFIG_NICE_OLED_CUSTOM_CANVAS_WIDTH=68
CONFIG_NICE_OLED_CUSTOM_CANVAS_HEIGHT=160

# ============================================================================
# DISPLAY WIDGETS - CENTRAL (Left Half)
# ============================================================================
# NOTE: zmk-nice-oled provides its own widget implementations
# Do NOT enable standard ZMK widgets (CONFIG_ZMK_WIDGET_*) to avoid conflicts

# Enable modifier keys widget (Shift, Ctrl, Alt, Win) at BOTTOM
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS=y
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS_CUSTOM_X=0
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS_CUSTOM_Y=145

# Profile widget (BT 0-4) at BOTTOM
CONFIG_NICE_OLED_WIDGET_PROFILE_CUSTOM_X=0
CONFIG_NICE_OLED_WIDGET_PROFILE_CUSTOM_Y=125

# WPM Widget - CENTER with LARGE font
CONFIG_NICE_OLED_WIDGET_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM_NUMBER=y
# Try to use a larger font if supported by the module
CONFIG_NICE_OLED_WIDGET_WPM_BIG=y
CONFIG_NICE_OLED_WIDGET_WPM_LABEL_CUSTOM_X=8
CONFIG_NICE_OLED_WIDGET_WPM_LABEL_CUSTOM_Y=70

# Disable animations on central
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=n
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=n
CONFIG_NICE_OLED_WIDGET_RESPONSIVE_BONGO_CAT=n

# ============================================================================
# DISPLAY WIDGETS - PERIPHERAL (Right Half)
# ============================================================================
# Disable ALL peripheral animations and static images (remove diamond)
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=n
CONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_GEM=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_STATIC=n

# ============================================================================
# BATTERY OPTIMIZATION
# ============================================================================
# Battery level reporting interval (seconds)
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# Split keyboard battery monitoring (both halves)
# Enable fetching battery level from peripheral (right half)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Enable reporting peripheral battery to host via BLE
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# ============================================================================
# KEYBOARD SETTINGS
# ============================================================================
# Custom keyboard name (visible in Bluetooth settings)
CONFIG_ZMK_KEYBOARD_NAME="Corne"

# Improved debounce timing (anti-bounce for key presses)
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# ============================================================================
# BLUETOOTH CONFIGURATION
# ============================================================================
# Increase BLE radio transmission power (improves connection quality)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Fix for Windows battery reporting issues
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# ============================================================================
# POWER MANAGEMENT
# ============================================================================
# Milliseconds of inactivity before entering idle state (5 minutes)
CONFIG_ZMK_IDLE_TIMEOUT=300000

# Enable deep sleep support
CONFIG_ZMK_SLEEP=y

# Milliseconds of inactivity before entering deep sleep (60 minutes)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# ============================================================================
# ZMK STUDIO (Real-time keymap editor via web browser)
# ============================================================================
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

# ============================================================================
# RGB UNDERGLOW (Disabled - no RGB LEDs on this board)
# ============================================================================
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y
