# Corne Keyboard Configuration - Clean Minimal Version
# Only essential settings for HID Indicators Bongo Cat (left) + Gem (right)

# ============================================================================
# DISPLAY CONFIGURATION
# ============================================================================
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Vertical canvas for nice-oled module
CONFIG_NICE_OLED_CUSTOM_CANVAS_WIDTH=68
CONFIG_NICE_OLED_CUSTOM_CANVAS_HEIGHT=160
CONFIG_LV_DPI_DEF=161

# ============================================================================
# ANIMATIONS
# ============================================================================
# Master (Left): HID Indicators Bongo Cat
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS_BONGO_CAT=y

# Peripheral (Right): Gem Animation - EXPLICITLY ENABLED
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_GEM=y

# Explicitly disable ALL other peripheral animations to prevent conflicts
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_HEAD=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_POKEMON=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SPACEMAN=n

# ============================================================================
# DISPLAY MANAGEMENT
# ============================================================================
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# Disable standard ZMK widgets to avoid conflicts
CONFIG_ZMK_WIDGET_LAYER_STATUS=n
CONFIG_ZMK_WIDGET_BATTERY_STATUS=n
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=n
CONFIG_ZMK_WIDGET_WPM_STATUS=n

# ============================================================================
# BATTERY OPTIMIZATION
# ============================================================================
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# ============================================================================
# KEYBOARD SETTINGS
# ============================================================================
CONFIG_ZMK_KEYBOARD_NAME="Corne"
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# ============================================================================
# BLUETOOTH CONFIGURATION
# ============================================================================
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# ============================================================================
# POWER MANAGEMENT
# ============================================================================
CONFIG_ZMK_IDLE_TIMEOUT=300000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# ============================================================================
# ZMK STUDIO
# ============================================================================
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

# ============================================================================
# MOUSE EMULATION
# ============================================================================
CONFIG_ZMK_MOUSE=y
