# ============================================================================
# DISPLAY CONFIGURATION
# ============================================================================
# Enable the Corne OLED Display
CONFIG_ZMK_DISPLAY=y

# ----------------------------------------------------------------------------
# NICE!OLED CONFIGURATION (Integrated)
# ----------------------------------------------------------------------------
# Abilita la schermata di stato personalizzata del modulo zmk-nice-oled
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Configurazione Canvas Verticale (Ottimizzato per Corne)
CONFIG_NICE_OLED_CUSTOM_CANVAS_WIDTH=68
CONFIG_NICE_OLED_CUSTOM_CANVAS_HEIGHT=160
CONFIG_LV_DPI_DEF=161

# Widget Display Sinistro (Centrale)
# Responsive Bongo Cat Animation
CONFIG_NICE_OLED_WIDGET_RESPONSIVE_BONGO_CAT=y
CONFIG_NICE_OLED_WIDGET_RESPONSIVE=y

# WPM Tracking & Numeric Widget
CONFIG_ZMK_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM_NUMBER=y

# Widget Display Destro (Periferico)
# Spaceman Animation (Alternative to Samurai)
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SPACEMAN=y

# ----------------------------------------------------------------------------
# DISPLAY WIDGETS (Standard ZMK - Alcuni disabilitati per evitare conflitti)
# ----------------------------------------------------------------------------
CONFIG_ZMK_WIDGET_LAYER_STATUS=n
CONFIG_ZMK_WIDGET_BATTERY_STATUS=n
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=n
CONFIG_ZMK_WIDGET_WPM_STATUS=n

# ----------------------------------------------------------------------------
# ALTERNATIVE & ADVANCED OPTIONS
# ----------------------------------------------------------------------------
# Gestione della coda di lavoro (DEDICATED è consigliato)
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
# CONFIG_ZMK_DISPLAY_WORK_QUEUE_SYSTEM=y

# Spegnimento automatico del display dopo inattività (risparmio batteria)
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# Periodo di refresh completo in secondi (utile per prevenire ghosting)
# CONFIG_ZMK_DISPLAY_FULL_REFRESH_PERIOD=300

# ----------------------------------------------------------------------------

# ============================================================================
# BATTERY OPTIMIZATION
# ============================================================================
# Battery level reporting interval (seconds)
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# Split keyboard battery monitoring (both halves)
# Enable fetching battery level from peripheral (right half)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Enable reporting peripheral battery to host via BLE
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# ============================================================================
# KEYBOARD SETTINGS
# ============================================================================
# Custom keyboard name (visible in Bluetooth settings)
CONFIG_ZMK_KEYBOARD_NAME="Corne"

# Improved debounce timing (anti-bounce for key presses)
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# ============================================================================
# BLUETOOTH CONFIGURATION
# ============================================================================
# Increase BLE radio transmission power (improves connection quality)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Fix for Windows battery reporting issues
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# ============================================================================
# POWER MANAGEMENT
# ============================================================================
# Milliseconds of inactivity before entering idle state (5 minutes)
CONFIG_ZMK_IDLE_TIMEOUT=300000

# Enable deep sleep support
CONFIG_ZMK_SLEEP=y

# Milliseconds of inactivity before entering deep sleep (60 minutes)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# ============================================================================
# ZMK STUDIO (Real-time keymap editor via web browser)
# ============================================================================
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n
