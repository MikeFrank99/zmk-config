# ============================================================================
# DISPLAY CONFIGURATION
# ============================================================================
# Enable the Corne OLED Display
CONFIG_ZMK_DISPLAY=y

# Dedicated work queue for display (improves performance)
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Blank display on idle to prevent OLED burn-in
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# ============================================================================
# DISPLAY WIDGETS
# ============================================================================
# Enable standard ZMK widgets
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_WPM_STATUS=y

# ============================================================================
# BATTERY OPTIMIZATION
# ============================================================================
# Battery level reporting interval (seconds)
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# Split keyboard battery monitoring (both halves)
# Enable fetching battery level from peripheral (right half)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Enable reporting peripheral battery to host via BLE
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# ============================================================================
# KEYBOARD SETTINGS
# ============================================================================
# Custom keyboard name (visible in Bluetooth settings)
CONFIG_ZMK_KEYBOARD_NAME="Corne"

# Improved debounce timing (anti-bounce for key presses)
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# ============================================================================
# BLUETOOTH CONFIGURATION
# ============================================================================
# Increase BLE radio transmission power (improves connection quality)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Fix for Windows battery reporting issues
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# ============================================================================
# POWER MANAGEMENT
# ============================================================================
# Milliseconds of inactivity before entering idle state (5 minutes)
CONFIG_ZMK_IDLE_TIMEOUT=300000

# Enable deep sleep support
CONFIG_ZMK_SLEEP=y

# Milliseconds of inactivity before entering deep sleep (60 minutes)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# ============================================================================
# ZMK STUDIO (Real-time keymap editor via web browser)
# ============================================================================
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n
